<!doctype html><html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>บันทึกความผิดพนักงานรายสาขา</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&family=Prompt:wght@500;600&display=swap" rel="stylesheet">
<style>
/* Layout: phone-first single column; brand sections of branch tiles; bottom nav + floating record button. */
:root {
  --bg: #f2f3f6;
  --surface: #ffffff;
  --ink: #1a1f2b;
  --muted: #5c6475;
  --line: #dde0e8;
  --accent: #2446c4;
  --accent-ink: #ffffff;
  --mala: #c42f2a;
  --express: #c76f00;
  --ok: #1d7f47;
  --warn: #a8670f;
  --bad: #c22f2f;
  --ok-bg: #e5f4ea;
  --warn-bg: #fbf0dc;
  --bad-bg: #fbe5e3;
  --chip: #eceef3;
  --shadow: 0 1px 2px rgba(20,25,40,.06), 0 4px 14px rgba(20,25,40,.06);
  --f-display: "Prompt", "IBM Plex Sans Thai", "Noto Sans Thai", sans-serif;
  --f-body: "IBM Plex Sans Thai", "Noto Sans Thai", "Leelawadee UI", Tahoma, sans-serif;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #12151c; --surface: #1b1f29; --ink: #e9ebf1; --muted: #9aa2b4; --line: #2c3240;
    --accent: #7d97ff; --accent-ink: #0d1020; --mala: #ff6f66; --express: #f0a23a;
    --ok: #5fd08e; --warn: #f0b44f; --bad: #ff7a72;
    --ok-bg: #173323; --warn-bg: #3a2c12; --bad-bg: #3d1a19; --chip: #262b37;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12151c; --surface: #1b1f29; --ink: #e9ebf1; --muted: #9aa2b4; --line: #2c3240;
  --accent: #7d97ff; --accent-ink: #0d1020; --mala: #ff6f66; --express: #f0a23a;
  --ok: #5fd08e; --warn: #f0b44f; --bad: #ff7a72;
  --ok-bg: #173323; --warn-bg: #3a2c12; --bad-bg: #3d1a19; --chip: #262b37;
  --shadow: 0 1px 2px rgba(0,0,0,.3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--ink); font: 15px/1.55 var(--f-body); padding-bottom: 96px; -webkit-tap-highlight-color: transparent; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 600; margin: 0; text-wrap: balance; line-height: 1.25; }
h1 { font-size: 20px; } h2 { font-size: 18px; } h3 { font-size: 15px; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.wrap { max-width: 960px; margin: 0 auto; padding: 0 16px; }
header.top { position: sticky; top: 0; z-index: 20; background: var(--bg); border-bottom: 1px solid var(--line); }
header.top .wrap { display: flex; flex-direction: column; gap: 10px; padding-top: 12px; padding-bottom: 10px; }
.title-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.title-row small { color: var(--muted); font-size: 12px; }
.seg { display: inline-flex; background: var(--chip); border-radius: 10px; padding: 3px; gap: 2px; }
.seg button { border: 0; background: transparent; padding: 6px 14px; border-radius: 8px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
main { display: flex; flex-direction: column; gap: 20px; padding-top: 16px; }
.notice { background: var(--warn-bg); color: var(--warn); border-radius: 10px; padding: 10px 12px; font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(100px, 1fr)); gap: 10px; }
.stat { background: var(--surface); border-radius: 12px; padding: 12px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 2px; border: 0; text-align: left; }
.stat b { font: 600 24px/1.1 var(--f-display); font-variant-numeric: tabular-nums; }
.stat span { color: var(--muted); font-size: 13px; }
.stat.bad b { color: var(--bad); } .stat.warn b { color: var(--warn); } .stat.ok b { color: var(--ok); }
.brand-sec { display: flex; flex-direction: column; gap: 10px; }
.brand-head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.brand-head .mark { width: 10px; height: 10px; border-radius: 3px; align-self: center; }
.brand-head small { color: var(--muted); }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px; text-align: left; display: flex; flex-direction: column; gap: 6px; min-height: 92px; position: relative; }
.tile:hover { border-color: var(--accent); }
.tile .name { font-weight: 600; line-height: 1.3; }
.tile .fmt { font-size: 12px; color: var(--muted); }
.tile .counts { margin-top: auto; display: flex; gap: 6px; flex-wrap: wrap; font-size: 12px; }
.tile.closed { opacity: .55; }
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 1px 8px; border-radius: 999px; font-size: 12px; font-weight: 500; background: var(--chip); color: var(--muted); white-space: nowrap; }
.badge.open { background: var(--bad-bg); color: var(--bad); }
.badge.follow { background: var(--warn-bg); color: var(--warn); }
.badge.closed { background: var(--ok-bg); color: var(--ok); }
.badge.mala { background: var(--bad-bg); color: var(--mala); }
.badge.express { background: var(--warn-bg); color: var(--express); }
.badge.late { background: var(--bad); color: #fff; }
.badge.issue { background: var(--chip); color: var(--accent); border: 1px solid var(--accent); }
.badge.p4 { background: var(--bad); color: #fff; } .badge.p3 { background: var(--bad-bg); color: var(--bad); }
.item.p-4 { border-left-color: var(--bad); } .item.p-3 { border-left-color: #e0731c; } .item.p-2 { border-left-color: var(--warn); } .item.p-1 { border-left-color: var(--line); }
.linkish { border: 0; background: none; padding: 0; color: var(--accent); font: inherit; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; text-align: left; }
.profile { display: flex; gap: 14px; align-items: center; }
.avatar { width: 56px; height: 56px; border-radius: 50%; background: var(--chip); color: var(--accent); display: grid; place-items: center; font: 600 22px var(--f-display); flex: none; }
.choice { display: flex; flex-direction: column; gap: 10px; }
.choice button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 2px; }
.choice button b { font-family: var(--f-display); font-size: 16px; }
.choice button span { color: var(--muted); font-size: 14px; }
.tl .kind { font-size: 12px; font-weight: 600; }
.tl .dot.inc { background: var(--bad); } .tl .dot.note { background: var(--accent); } .tl .dot.good { background: var(--ok); }
.ptabs { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.ptabs button { flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; padding: 7px 14px; font-weight: 500; }
.ptabs button[aria-current="page"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.flags { display: flex; gap: 4px; flex-wrap: wrap; }
.scorechip { font: 600 18px/1 var(--f-display); font-variant-numeric: tabular-nums; min-width: 44px; text-align: center; padding: 6px 4px; border-radius: 8px; background: var(--chip); }
.scorechip.g-a { color: var(--ok); } .scorechip.g-b { color: var(--accent); } .scorechip.g-c { color: var(--warn); background: var(--warn-bg); } .scorechip.g-d { color: var(--bad); background: var(--bad-bg); }
.trow { display: grid; grid-template-columns: 1fr auto; gap: 6px 12px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; text-align: left; }
.trow .n { font-weight: 600; } .trow .s { font-size: 13px; color: var(--muted); }
.trow .nums { grid-column: 1 / -1; display: flex; gap: 6px 14px; flex-wrap: wrap; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }
.trow .nums b { color: var(--ink); font-weight: 600; }
.feed { display: flex; flex-direction: column; }
.feed button { display: grid; grid-template-columns: 74px 1fr; gap: 10px; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: none; padding: 9px 0; }
.feed button:last-child { border-bottom: 0; }
.feed .d { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; padding-top: 2px; }
.feed .t { font-size: 14px; } .feed .t b { font-weight: 600; } .feed .t small { color: var(--muted); display: block; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
details.done summary { cursor: pointer; color: var(--muted); font-size: 14px; padding: 6px 0; }
.list { display: flex; flex-direction: column; gap: 8px; }
.item { background: var(--surface); border: 1px solid var(--line); border-left: 4px solid var(--line); border-radius: 10px; padding: 10px 12px; text-align: left; display: flex; flex-direction: column; gap: 4px; width: 100%; }
.item.sev-1 { border-left-color: var(--warn); } .item.sev-2 { border-left-color: #e0731c; } .item.sev-3 { border-left-color: var(--bad); }
.item .row1 { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.item .who { font-weight: 600; }
.item .meta { font-size: 13px; color: var(--muted); display: flex; gap: 6px 10px; flex-wrap: wrap; }
.item .desc { font-size: 14px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.empty { color: var(--muted); padding: 20px; text-align: center; background: var(--surface); border-radius: 12px; border: 1px dashed var(--line); }
.bar { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.bar > * { flex: 1 1 140px; }
.field { display: flex; flex-direction: column; gap: 4px; }
.field label { font-size: 13px; color: var(--muted); font-weight: 500; }
.field label .req { color: var(--bad); }
input[type="text"], input[type="date"], input[type="month"], input[type="search"], input[type="tel"], select, textarea {
  width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; min-height: 44px;
}
textarea { min-height: 96px; resize: vertical; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 10px 14px; font-weight: 500; min-height: 44px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); background: transparent; }
.btn.small { min-height: 34px; padding: 5px 10px; font-size: 14px; }
.btn:disabled { opacity: .55; cursor: default; }
.back { border: 0; background: none; color: var(--accent); padding: 4px 0; font-weight: 500; align-self: flex-start; }
.card { background: var(--surface); border-radius: 12px; padding: 14px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 12px; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 6px 12px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; white-space: pre-wrap; word-break: break-word; }
@media (max-width: 420px) { .kv { grid-template-columns: 1fr; } .kv dt { margin-top: 6px; } }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 8px; }
.ph { position: relative; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--chip); border: 0; padding: 0; }
.ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph .x { position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%; border: 0; background: rgba(0,0,0,.6); color: #fff; font-size: 15px; line-height: 1; }
.ph .missing { display: grid; place-items: center; height: 100%; font-size: 12px; color: var(--muted); }
.photo-add { display: flex; gap: 8px; flex-wrap: wrap; }
.photo-add label { flex: 1 1 140px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.timeline { display: flex; flex-direction: column; gap: 0; }
.tl { display: grid; grid-template-columns: 14px 1fr; gap: 10px; }
.tl .dot { width: 10px; height: 10px; border-radius: 50%; background: var(--accent); margin-top: 6px; position: relative; }
.tl .dot.sys { background: var(--muted); }
.tl .body { padding-bottom: 14px; border-bottom: 1px solid var(--line); margin-bottom: 12px; display: flex; flex-direction: column; gap: 6px; }
.tl:last-child .body { border-bottom: 0; margin-bottom: 0; }
.tl .when { font-size: 12px; color: var(--muted); }
.tl .txt { white-space: pre-wrap; word-break: break-word; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; background: none; padding: 8px 12px; color: var(--muted); font-weight: 500; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.emp { display: flex; justify-content: space-between; align-items: center; gap: 10px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; width: 100%; text-align: left; }
.emp .n { font-weight: 600; } .emp .s { font-size: 13px; color: var(--muted); }
.emp.left { opacity: .6; }
.grp-title { font-size: 13px; color: var(--muted); font-weight: 600; margin-top: 6px; }
nav.bottom { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom); }
nav.bottom .wrap { display: grid; grid-template-columns: repeat(5, 1fr); padding: 0; }
nav.bottom button { border: 0; background: none; padding: 9px 4px 8px; font-size: 12px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; }
nav.bottom button svg { width: 22px; height: 22px; }
nav.bottom button[aria-current="page"] { color: var(--accent); font-weight: 600; }
.fab { position: fixed; right: 16px; bottom: calc(72px + env(safe-area-inset-bottom)); z-index: 26; border: 0; border-radius: 999px; background: var(--accent); color: var(--accent-ink); padding: 14px 18px; font-weight: 600; box-shadow: 0 6px 20px rgba(36,70,196,.35); display: flex; gap: 8px; align-items: center; }
.fab svg { width: 20px; height: 20px; }
.overlay { position: fixed; inset: 0; z-index: 40; background: rgba(10,12,20,.5); display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 640px; max-height: 92%; overflow: auto; border-radius: 16px 16px 0 0; padding: 16px 16px calc(20px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 14px; }
@media (min-width: 700px) { .overlay { align-items: center; } .sheet { border-radius: 16px; max-height: 88%; } }
.sheet-head { display: flex; justify-content: space-between; align-items: center; gap: 10px; position: sticky; top: -16px; background: var(--bg); padding: 4px 0 8px; z-index: 1; }
.sheet-head .btn { min-height: 36px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .grid2 { grid-template-columns: 1fr; } }
.form { display: flex; flex-direction: column; gap: 12px; }
.err { color: var(--bad); font-size: 14px; }
.progress { color: var(--muted); font-size: 14px; }
.lightbox { position: fixed; inset: 0; z-index: 60; background: rgba(0,0,0,.92); display: grid; place-items: center; padding: 16px; }
.lightbox img { max-width: 100%; max-height: 100%; object-fit: contain; }
.lightbox button { position: absolute; top: 12px; right: 12px; background: rgba(255,255,255,.15); color: #fff; border: 0; border-radius: 999px; padding: 8px 14px; }
table.rep { width: 100%; border-collapse: collapse; font-size: 14px; }
table.rep th, table.rep td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; font-variant-numeric: tabular-nums; }
table.rep th:first-child, table.rep td:first-child { text-align: left; }
table.rep th { color: var(--muted); font-weight: 500; font-size: 13px; }
table.rep tr.brandrow td { font-weight: 600; background: var(--chip); }
.scroll { overflow-x: auto; }
.hbar { display: grid; grid-template-columns: 150px 1fr 36px; gap: 8px; align-items: center; font-size: 14px; }
.hbar .track { height: 10px; background: var(--chip); border-radius: 5px; overflow: hidden; }
.hbar .fill { height: 100%; background: var(--accent); border-radius: 5px; }
.hbar b { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }
.confirm { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; background: var(--bad-bg); padding: 10px; border-radius: 10px; color: var(--bad); }
.status-btns { display: flex; gap: 8px; flex-wrap: wrap; }
.status-btns .btn[aria-pressed="true"] { border-width: 2px; font-weight: 600; }
.status-btns .open[aria-pressed="true"] { border-color: var(--bad); color: var(--bad); }
.status-btns .follow[aria-pressed="true"] { border-color: var(--warn); color: var(--warn); }
.status-btns .closed[aria-pressed="true"] { border-color: var(--ok); color: var(--ok); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(140px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 10px; z-index: 70; font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .18s ease-out; } @keyframes up { from { transform: translateY(24px); opacity: .6; } } }
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="title-row">
    <div><h1>บันทึกความผิดพนักงาน</h1><small id="sync">กำลังเชื่อมต่อฐานข้อมูล…</small></div>
    <button type="button" class="btn small" id="addEmp" hidden>+ เพิ่มพนักงาน</button>
  </div>
  <div class="seg" role="group" aria-label="เลือกแบรนด์" id="brandSeg"></div>
</div></header>
<main class="wrap" id="main"></main>
<button class="fab" id="fab" type="button" aria-label="บันทึกข้อมูลใหม่">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>บันทึก
</button>
<nav class="bottom" aria-label="เมนูหลัก"><div class="wrap" id="nav"></div></nav>
<div id="layer"></div>

<script>
"use strict";
/* ---------- Branch master list (from the company list) ---------- */
const BRANDS = [
  { id: "mala", name: "Mala", color: "var(--mala)", branches: [
    ["m01","วงเวียนใหญ่","Shabu"],["m02","พระราม 3","Shabu"],["m03","พุทธมณฑลสาย 2","Shabu"],
    ["m04","บางบอน 5","Shabu"],["m05","บรมสิรินธร","Shabu"] ] },
  { id: "express", name: "Express", color: "var(--express)", branches: [
    ["e01","มหานคร","Go (ไม่มี Delivery)",1],["e02","ติวานนท์ 28","Delivery Only"],["e03","บางนา","Go"],
    ["e04","ทาวน์อินทาวน์","Go"],["e05","สีลม","Go*"],["e06","สระบุรี","Go"],["e07","ลาดพร้าว 12","Delivery Only"],
    ["e08","นวมินทร์","ตักชั่ง"],["e09","วิภาวดี","Delivery Only"],["e10","บรรทัดทอง","Go",1],["e11","ลาดพร้าว 71","ตักชั่ง"],
    ["e12","เกษตร","ตักชั่ง"],["e13","ราชพฤกษ์","Go"],["e14","The Nine พระราม 9","Delivery Only*"],["e15","บางแค","ตักชั่ง"],
    ["e16","เพชรเกษม","Delivery Only"],["e17","บางใหญ่","Delivery Only"],["e18","ลาดกระบัง","Go"],["e19","สนามเป้า","ตักชั่ง"],
    ["e20","สาธุ 19","ตักชั่ง"],["e21","ติวานนท์ T10","ตักชั่ง"],["e22","คลอง 3","ตักชั่ง"],["e23","ปู่เจ้า","ตักชั่ง"],
    ["e24","กิ่งแก้ว","ตักชั่ง"],["e25","รัตนธิเบศร์","ตักชั่ง"],["e26","อ้อมใหญ่","ตักชั่ง"],["e27","สามเสน","Go"],
    ["e28","อุดมสุข 45","ตักชั่ง"],["e29","วชิรธรรม","ตักชั่ง"],["e30","ตำหรุ บางพลี","ตักชั่ง"],
    ["e31","บางพลัด / Lotus จรัญ","ตักชั่ง"],["e32","วัดลาดปลาดุก","ตักชั่ง"],["e33","หนามแดง","ตักชั่ง"],
    ["e34","จรัญ","ตักชั่ง"],["e35","ห้วยขวาง","ตักชั่ง"],["e36","เยาวราช","ตักชั่ง"],["e37","วิภา","ตักชั่ง"] ] }
];

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) for (const k in attrs) {
    const v = attrs[k];
    if (v == null || v === false) continue;
    if (k === "class") el.className = v;
    else if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "text") el.textContent = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of kids.flat(Infinity)) if (c != null && c !== false) el.append(c.nodeType ? c : String(c));
  return el;
}

function loadImage(file) {
  return new Promise((res, rej) => { const url = URL.createObjectURL(file); const img = new Image(); img.onload = () => { URL.revokeObjectURL(url); res(img); }; img.onerror = () => { URL.revokeObjectURL(url); rej(new Error("อ่านรูปไม่ได้")); }; img.src = url; });
}
async function compress(file, max, q, asDataUrl) {
  const img = await loadImage(file);
  const r = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
  const c = document.createElement("canvas"); c.width = Math.round(img.naturalWidth * r); c.height = Math.round(img.naturalHeight * r);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
  if (asDataUrl) return c.toDataURL("image/jpeg", q);
  return new Promise(res => c.toBlob(res, "image/jpeg", q));
}

function connect(form,type,branch,fields,photos) {
  let key=crypto.randomUUID();
  const close=openSheet(type,form);
  const feedback=h("div",{role:"status","aria-live":"polite",hidden:true});
  const meter=h("progress",{max:100,value:0,style:"width:100%"});
  const message=h("div",{class:"progress"});
  feedback.append(meter,message);form.insertBefore(feedback,form.querySelector("[type=submit]"));
  function update(percent,label){feedback.hidden=false;meter.value=percent;message.textContent=percent+"% · "+label;}
  form.onsubmit=async event=>{
    event.preventDefault();
    const btn=form.querySelector('[type=submit]'),err=form.querySelector('.err');
    if(btn.disabled)return;
    btn.disabled=true;err.textContent="";
    let timer;
    try {
      if(!BR[branch.value] || BR[branch.value].closed) throw Error("กรุณาเลือกสาขาที่เปิดอยู่");
      if(photos.length>5) throw Error("แนบรูปได้ไม่เกิน 5 รูป");
      const total=photos.length+3;
      let done=1;
      update(Math.floor(100*done/total),"ตรวจข้อมูลแล้ว");
      const images=[];
      for(const file of photos){
        images.push(await compress(file,1000,.65,true));
        update(Math.floor(100*++done/total),"เตรียมรูปแล้ว "+images.length+"/"+photos.length);
      }
      const payload={key,type,branch:BR[branch.value].name,fields:fields(),images};
      const waiting=Math.floor(100*++done/total), started=Date.now();
      const showWait=()=>update(waiting,"กำลังส่งและรอเลขรับเรื่อง · "+Math.floor((Date.now()-started)/1000)+" วินาที");
      showWait();timer=setInterval(showWait,1000);
      const response=await fetch("https://script.google.com/macros/s/AKfycbz-forYe8uMXFi1RLtzb9rhm42pv0FIj0_tHi38SAnxTHs03AGaMmfcdxsNeYfyOvQp/exec",{
        method:"POST", credentials:"omit",
        headers:{"Content-Type":"text/plain;charset=utf-8"},
        body:JSON.stringify(payload)
      });
      if(!response.ok) throw Error("ส่งเรื่องไม่สำเร็จ กรุณาลองอีกครั้ง");
      const result=await response.json();
      if(result.id!=="XX-"+key && !(result.key===key && /^XX-\d{6,}$/.test(result.id))) throw Error(result.error || "ยังยืนยันการรับเรื่องไม่ได้ กรุณาลองอีกครั้ง");
      const id=result.id;
      update(100,"บันทึกสำเร็จ");
      close();openSheet("ส่งเรื่องแล้ว · 100%",h("div",{class:"notice",text:"ทีมกลางได้รับเรื่องแล้ว · "+id}));
    }catch(e){feedback.hidden=true;err.textContent=e.message || "ส่งไม่สำเร็จ กรุณาลองอีกครั้ง"}finally{clearInterval(timer);btn.disabled=false}
  };
}
